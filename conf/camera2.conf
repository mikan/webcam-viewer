# /usr/etc/motion/camera2.conf
#
# This config file was generated by motion 4.7.0

###########################################################
# Configuration options specific to camera 2
############################################################
# User defined name for the camera.
camera_name Camera2

# Numeric identifier for the camera.
camera_id 102

# The full URL of the network camera stream.
netcam_url rtsp://admin:password@192.168.1.100:554/channel2
netcam_high_url rtsp://admin:password@192.168.1.100:554/channel2

# Image width in pixels.
width 640

# Image height in pixels.
height 480

# Text to be overlayed in the lower left corner of images
#text_left Camera2

# Text to be overlayed in the lower right corner of images.
text_right %Y-%m-%d\n%T-%q

# File name(without extension) for movies relative to target directory
#movie_filename CAM02_%t-%v-%Y%m%d%H%M%S

# Additional parameters
target_dir /var/lib/motion2
picture_output on
picture_filename x-archive-%Y%m%d-%H%M%S
snapshot_interval 15
snapshot_filename webcam
movie_output on
movie_filename y-archive-%Y%m%d-%H%M%S
noise_level 42
noise_tune off
